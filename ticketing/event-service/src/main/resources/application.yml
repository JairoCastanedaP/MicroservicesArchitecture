spring:
  application:
    name: event-service

  # Sesión 2: cada servicio tiene SU base de datos (Database per Service).
  # H2 guarda los datos en el archivo ./data/event_db.mv.db (sobreviven al reinicio).
  # AUTO_SERVER=TRUE permite abrir la misma base desde dos procesos (la app y los tests).
  # En otros ambientes se sobrescribe con variables de entorno (Docker, Azure, Kubernetes...).
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/event_db;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  # Consola web de H2 en http://localhost:8081/h2-console (solo para desarrollo)
  h2:
    console:
      enabled: true

  jpa:
    # Flyway crea el esquema; Hibernate solo comprueba que las entidades coincidan con las tablas
    hibernate:
      ddl-auto: validate
    # Sin "Open Session in View": la sesión de Hibernate se cierra al terminar el servicio (@Transactional),
    # así los problemas de carga perezosa (LAZY) aparecen en desarrollo y no en producción
    open-in-view: false

  web:
    error:
      # Nota Boot 4: antes era server.error.include-*; ahora es spring.web.error.include-*
      include-message: always
      include-stacktrace: never

server:
  # Cada microservicio tiene un puerto fijo (event-service = 8081, booking-service = 8082...).
  # Se puede sobrescribir con la variable de entorno SERVER_PORT.
  port: ${SERVER_PORT:8081}

logging:
  level:
    # Muestra el SQL que genera Hibernate (útil para aprender y para detectar el problema N+1).
    # Cámbialo a "info" con la variable de entorno SQL_LOG_LEVEL=info si genera demasiado ruido.
    org.hibernate.SQL: ${SQL_LOG_LEVEL:debug}

# Propiedades propias del servicio
ticketing:
  seed-data:
    enabled: true
