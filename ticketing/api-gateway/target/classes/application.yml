spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          # Clave pública de user-service para validar la firma de los tokens
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8084/.well-known/jwks.json}
          issuer-uri: ${ticketing.jwt.issuer}
          authorities-claim-name: roles
          authority-prefix: ROLE_
  web:
    error:
      include-message: always
      include-stacktrace: never

  cloud:
    gateway:
      server:
        webflux:
          # Cada ruta envía las peticiones cuyo path coincide al servicio de su "uri". El path NO cambia.
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**
            - id: event-service
              uri: ${EVENT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/events/**,/api/v1/venues/**
            - id: booking-service
              uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/bookings/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/payments/**
          # Filtros que se aplican a TODAS las rutas
          default-filters:
            # Marca cada respuesta: así se ve en el cliente que la petición pasó por el gateway
            - AddResponseHeader=X-Gateway, ticketing-api-gateway

server:
  # Puerto 8080: el único que el cliente necesita conocer
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway   # /actuator/gateway/routes lista las rutas configuradas
  endpoint:
    gateway:
      access: read-only            # solo consultar las rutas (no crearlas ni borrarlas en caliente)

logging:
  level:
    # "debug" muestra qué ruta eligió el gateway para cada petición
    org.springframework.cloud.gateway: ${GATEWAY_LOG_LEVEL:info}

ticketing:
  jwt:
    issuer: http://localhost:8084
